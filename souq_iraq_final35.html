  background:rgba(10,16,40,.58);border:1px solid rgba(255,255,255,.14);

.fcard .face.back{transform:rotateX(180deg)}
.fcard .face.off{pointer-events:none;visibility:hidden;transition:visibility 0s .45s}
.auth .fcard .ain{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:0;max-width:none;margin:0;padding:18px 18px 22px}

 {const mine=S.orders.filter(o=>o.co==co.id&&S.user.store&&S.user.store.id==o.s);S.orders.filter(o=>o.co==co.id).forEach(o=>o.u=Date.now());syncVO();if(cod||wal)mine.forEach(alertNew)}

const H=async x=>{const s="souq:"+x;
 if(window.crypto&&crypto.subtle){try{return [...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("")}catch(e){}}
 /* بديل عند فتح الملف من غير HTTPS (crypto.subtle غير متاح): FNV-1a مزدوج، للنموذج التجريبي فقط */
 let h1=0x811c9dc5,h2=0x1b873593;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,16777619)>>>0;h2=Math.imul(h2+c,2654435761)>>>0}
